[package]
name = "inkstone-raster"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Experimental Pango/Cairo heading rasterizer for inkstone.nvim"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
